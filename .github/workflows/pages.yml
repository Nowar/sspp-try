name: build-and-deploy
on:
  schedule:
    - cron: '30 6 * * *'    # 台灣時間 14:30（台股收盤後）
    - cron: '30 22 * * *'   # 台灣時間 06:30（美股收盤後）
  workflow_dispatch:
    inputs:
      full:
        description: '整段重抓（忽略快取）'
        type: boolean
        default: false
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: build-and-deploy
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install yfinance pandas
      - run: python build_site.py
        env:
          FULL: ${{ inputs.full && '1' || '0' }}
      - name: save price cache to repo
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add data
          git diff --cached --quiet || (git commit -m "update price cache" && git pull --rebase && git push)
      - uses: actions/upload-pages-artifact@v3
        with: {path: dist}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
